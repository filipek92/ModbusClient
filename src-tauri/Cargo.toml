[package]
name = "modbus-client"
version = "1.2.8"
description = "Modbus Client with Tauri, Vue and Quasar"
authors = ["Filip Richter <richter.filip@gmail.com>"]
edition = "2021"

[lib]
name = "modbus_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "net"] }
tokio-modbus = { version = "0.17", default-features = false, features = ["rtu", "tcp"] }
tokio-serial = "5.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
flate2 = "1"
tar = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }
